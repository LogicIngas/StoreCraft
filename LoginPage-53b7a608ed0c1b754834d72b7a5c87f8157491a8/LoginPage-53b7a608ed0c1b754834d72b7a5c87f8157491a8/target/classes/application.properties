# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================

# MySQL Connection - Using environment variables with defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:logindb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================================
# HIBERNATE / JPA CONFIGURATION
# ============================================================================

# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# UUID Generation Strategy
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.loginpage=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_BINDER:TRACE}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# FILE UPLOAD CONFIGURATION
# ============================================================================

# Upload directory (relative to project root)
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Maximum file size
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:10MB}

# ============================================================================
# CORS CONFIGURATION
# ============================================================================

# Frontend URL (configured in WebMvcConfig.java)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================================
# JACKSON CONFIGURATION (JSON Serialization)
# ============================================================================

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# TRANSACTION CONFIGURATION
# ============================================================================

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

# ============================================================================
# APPLICATION-SPECIFIC CONFIGURATION
# ============================================================================

# Application Name
app.name=${APP_NAME:E-Marketplace}
app.version=${APP_VERSION:1.0.0}

# Payment Configuration
payment.gateway.mock.enabled=${PAYMENT_GATEWAY_MOCK_ENABLED:true}
payment.gateway.mock.delay-ms=${PAYMENT_GATEWAY_MOCK_DELAY_MS:1000}
payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:10}

# ============================================================================
# ACTUATOR & METRICS
# ============================================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always