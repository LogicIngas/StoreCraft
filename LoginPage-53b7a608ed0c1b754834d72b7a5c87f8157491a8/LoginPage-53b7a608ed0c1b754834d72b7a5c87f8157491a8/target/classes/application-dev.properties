# ============================================================================
# DEVELOPMENT PROFILE CONFIGURATION
# ============================================================================

# Activate this profile with: -Dspring.profiles.active=dev

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/logindb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# Show SQL in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable dev logging
logging.level.root=INFO
logging.level.com.example.loginpage=DEBUG

# Payment mock enabled (for testing)
payment.gateway.mock.enabled=true

# Frontend
frontend.url=http://localhost:5173