# ============================================================================
# PRODUCTION PROFILE CONFIGURATION
# ============================================================================

# Activate this profile with: -Dspring.profiles.active=prod

# Database Configuration (set as environment variables / Render env vars)
# DB_URL, DB_USERNAME, DB_PASSWORD (or DB_HOST, DB_PORT, DB_NAME, DB_SSLMODE)
# are read from the environment and fall back to the values defined in
# application.properties.

# Trust the reverse proxy in front of the app so redirects and generated URLs
# use https and the real client address.
server.forward-headers-strategy=framework
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# Hide SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Optimize startup time for Render
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.main.lazy-initialization=true

# Production logging
logging.level.root=WARN
logging.level.com.example.loginpage=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Payment gateway. The bundled gateway is a simulation with no real processor,
# so it stays enabled unless a real integration is supplied. Overridable per
# environment.
payment.gateway.mock.enabled=${PAYMENT_GATEWAY_MOCK_ENABLED:true}

# File upload - point this at the mounted persistent disk in production
file.upload-dir=${FILE_UPLOAD_DIR:/var/data/uploads}

# Frontend (production URL) - used only for CORS. The deployment serves the SPA
# and the API from the same host, so same-origin requests never hit CORS; this
# value only matters if the frontend is hosted on a different domain.
frontend.url=${FRONTEND_URL:http://localhost:5173}
