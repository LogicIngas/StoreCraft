# ============================================================================
# PRODUCTION PROFILE CONFIGURATION
# ============================================================================

# Activate this profile with: -Dspring.profiles.active=prod

# Database Configuration (These should be set as environment variables)
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD will be read from environment

# Hide SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.root=WARN
logging.level.com.example.loginpage=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# Payment gateway (production)
payment.gateway.mock.enabled=false

# File upload
file.upload-dir=/var/uploads

# Frontend (production URL) - MUST be set via environment variable
frontend.url=${FRONTEND_URL}