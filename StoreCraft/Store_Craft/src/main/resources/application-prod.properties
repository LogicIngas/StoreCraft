# ============================================================================
# PRODUCTION PROFILE CONFIGURATION
# ============================================================================

# Activate this profile with: -Dspring.profiles.active=prod

# Trust the reverse proxy in front of the app
server.forward-headers-strategy=framework
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# Hide SQL in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Optimize startup time for Render
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.main.lazy-initialization=true

# Production logging
logging.level.root=WARN
logging.level.com.example.loginpage=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Payment gateway
payment.gateway.mock.enabled=${PAYMENT_GATEWAY_MOCK_ENABLED:true}

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:/var/data/uploads}

# Frontend (production URL) - used only for CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================================
# BREVO — PRODUCTION OVERRIDES
# ============================================================================
# Prefer HTTP API in prod: Render's free tier throttles outbound SMTP on 587.
# HTTPS is always reachable.
brevo.smtp.enabled=${BREVO_SMTP_ENABLED:false}
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3/smtp/email

# Sender identity
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:E-Marketplace}

# Public URL used inside emails (verification / reset links)
app.base-url=${APP_BASE_URL}

# SMTP fallback (still declared — works if BREVO_SMTP_ENABLED is flipped to true)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}