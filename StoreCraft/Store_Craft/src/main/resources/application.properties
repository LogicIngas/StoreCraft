# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================

# ACTIVE PROFILE - "dev" locally, overridden via SPRING_PROFILES_ACTIVE in deployments
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================

# PostgreSQL Connection via Supabase Transaction Pooler (Port 6543)
# All values are sourced from environment variables (/.env locally, Render env vars in production).
# No hardcoded fallbacks — startup will fail fast if any variable is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================================================
# HIBERNATE / JPA CONFIGURATION
# ============================================================================

# The dialect is intentionally not set: Hibernate 6 detects PostgreSQL from the
# JDBC connection metadata (HHH90000025 warns when it is declared explicitly).
# ddl-auto=update lets Hibernate create/evolve the schema on first boot.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.main.allow-circular-references=true

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.loginpage=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_BINDER:TRACE}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================================
# FILE UPLOAD CONFIGURATION
# ============================================================================

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:10MB}

# ============================================================================
# CORS CONFIGURATION
# ============================================================================

frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================================================
# JACKSON CONFIGURATION
# ============================================================================

spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# TRANSACTION CONFIGURATION
# ============================================================================

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.open-in-view=false

# ============================================================================
# APPLICATION-SPECIFIC CONFIGURATION
# ============================================================================

app.name=${APP_NAME:E-Marketplace}
app.version=${APP_VERSION:1.0.0}

payment.gateway.mock.enabled=${PAYMENT_GATEWAY_MOCK_ENABLED:true}
payment.gateway.mock.delay-ms=${PAYMENT_GATEWAY_MOCK_DELAY_MS:1000}
payment.timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:10}

# ============================================================================
# ACTUATOR & METRICS
# ============================================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Mail health excluded: SMTP creds are optional (failures are caught by the service layer)
# Without this, a missing MAIL_PASSWORD causes the app to report overall status=DOWN
management.health.mail.enabled=false

# ============================================================================
# EMAIL CONFIGURATION
# ============================================================================
# Mail failures are caught and logged by the service, so the app still starts
# when these are unset. Supply real SMTP credentials per environment.

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Templates
email.templates.path=classpath:/templates/email/

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
# Base64 encoded 256-bit key. The fallback below is for local development only
# and is public knowledge - it MUST be overridden in every deployed environment
# via the JWT_SECRET variable, otherwise anyone could forge valid tokens.
jwt.secret=${JWT_SECRET:U3RvcmVDcmFmdFNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjIwMjY=}
